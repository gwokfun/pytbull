# Detection Rule Template
# Use this template to create custom detection rules
# Copy this file and modify according to your needs

---
# Rule Metadata
rule_id: "CUSTOM-001"  # Unique identifier (use CUSTOM- prefix for custom rules)
name: "My Custom Detection Rule"  # Short descriptive name
description: "Detailed description of what this rule detects"  # What threat or behavior this detects
category: "network"  # Category: network, process, file, user, resource
severity: "medium"  # Severity: low, medium, high, critical
enabled: true  # Set to false to disable the rule
version: "1.0"  # Rule version
author: "Your Name"  # Rule author
created_at: "2026-04-29"  # Creation date
updated_at: "2026-04-29"  # Last update date

# Tags for classification
tags:
  - tag1
  - tag2
  - tag3

# Data Sources
# Specify which data sources this rule uses
data_sources:
  - auditd  # Linux audit logs
  # - netlink  # Network connections
  # - proc_monitor  # Process metrics

# Detection Conditions
conditions:
  # Event type to match
  event_type: "SYSCALL"  # SYSCALL, EXECVE, PATH, USER_LOGIN, etc.

  # Syscall filter (for SYSCALL events)
  syscall:
    - "connect"
    - "sendto"

  # Field matching conditions
  match:
    # Example: match specific field values
    dest_ip:
      type: "public_ip"  # Field condition
      exclude_ranges:
        - "10.0.0.0/8"

    # Example: process pattern matching
    process:
      patterns:
        - "/bin/bash"
        - "/bin/sh"
      not_in_whitelist: true

    # Example: file path matching
    file_path:
      patterns:
        - "/etc/passwd"
        - "/etc/shadow"

  # Exclude conditions (optional)
  exclude:
    users:
      - "root"
    processes:
      - "/usr/bin/apt"

# Threshold Detection (optional)
# Triggers alert only when threshold is exceeded
threshold:
  type: "frequency"  # frequency, count, unique_count, rate, volume
  count: 10  # Threshold count
  time_window: 60  # Time window in seconds
  field: "dest_ip"  # Field to count
  group_by: "process"  # Group by field (optional)

# Event Correlation (optional)
# Correlate multiple events for complex detection
correlation:
  enabled: true
  time_window: 300  # Time window for correlation in seconds
  events:
    - type: "SYSCALL"
      syscall: "connect"
      relationship: "parent_process"  # Relationship type

  # Pattern indicators (optional)
  indicators:
    connection_failures_rate: "> 0.8"
    port_range_wide: true

# Data Enrichment (optional)
# Add additional context to events
enrichment:
  - type: "geoip"  # GeoIP lookup
    field: "dest_ip"
    output: "geo_info"

  - type: "process_tree"  # Process tree
    field: "pid"
    depth: 3

  - type: "user_info"  # User information
    field: "uid"

  - type: "file_hash"  # File hash
    field: "file_path"
    algorithm: "sha256"

# Alert Configuration
alert:
  enabled: true
  title: "Alert Title"  # Alert title (can use variables)
  message: "Alert message with {variables}"  # Alert message (can use variables)

  # Fields to include in alert
  fields:
    - timestamp
    - hostname
    - user
    - process
    - dest_ip

  # Response actions (optional)
  actions:
    - type: "log"
      output: "alerts.log"

    - type: "syslog"
      priority: "warning"

    - type: "webhook"
      url: "http://siem/api/alert"

# Alert Suppression (optional)
# Prevent alert storms by deduplicating similar alerts
suppression:
  enabled: true
  duration: 300  # Suppression window in seconds
  fields:  # Fields used for deduplication
    - process
    - dest_ip

# Time-based Conditions (optional)
# Only trigger alerts during specific time windows
time:
  # Working hours configuration
  working_hours:
    enabled: false
    weekdays: [1, 2, 3, 4, 5]  # 1=Monday, 7=Sunday
    start_time: "09:00"
    end_time: "18:00"
    alert_outside: true  # Alert outside working hours

  # Or specific time range
  time_range:
    start_time: "00:00"
    end_time: "06:00"

---
# You can define multiple rules in the same file
# Just add another rule block below with --- separator

# Example Rule 2
rule_id: "CUSTOM-002"
name: "Another Detection Rule"
description: "Description of second rule"
category: "process"
severity: "low"
enabled: true
version: "1.0"

data_sources:
  - auditd

conditions:
  event_type: "EXECVE"
  match:
    process:
      patterns:
        - "/usr/bin/example"

alert:
  enabled: true
  title: "Example Alert"
  message: "Process {process} executed"
