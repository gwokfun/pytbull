# Linux Auditd-Based Threat Detection System Configuration
# Version: 1.0

[system]
name = Host Threat Detection System
version = 1.0
enable = true
description = Real-time threat detection based on Linux auditd

[data_collection]
# Auditd configuration
auditd_enable = true
auditd_log_path = /var/log/audit/audit.log
auditd_buffer_size = 8192
auditd_follow_mode = true

# Proc filesystem monitoring
proc_monitor_enable = true
proc_scan_interval = 5
proc_metrics = cpu,memory,network,io

# Netlink monitoring
netlink_enable = true
netlink_protocols = tcp,udp,icmp

[processing]
# Event processing configuration
workers = 4
queue_size = 10000
batch_size = 100
flush_interval = 1

[detection]
# Detection rules configuration
rule_dirs = conf/threat_detection/detection_rules,conf/threat_detection/detection_rules/custom
reload_interval = 60

# Event correlation
correlation_enable = true
correlation_time_window = 300
correlation_max_events = 1000

# Behavioral baseline (optional - requires learning period)
baseline_enable = false
baseline_learning_period = 7

[alerting]
# Alert configuration
enable = true
min_severity = medium

# Deduplication
deduplication_enable = true
deduplication_window = 60

# Output configurations
output_file_enable = true
output_file_path = /var/log/threat_detection/alerts.log
output_file_format = json

output_syslog_enable = false
output_syslog_host = 127.0.0.1
output_syslog_port = 514
output_syslog_facility = local0

output_webhook_enable = false
output_webhook_url = http://siem-server/api/alerts
output_webhook_method = POST
output_webhook_auth_header = Authorization: Bearer YOUR_TOKEN

# Email notification (optional)
notification_email_enable = false
notification_smtp_server = smtp.example.com
notification_smtp_port = 587
notification_smtp_user = alerts@example.com
notification_smtp_password = YOUR_PASSWORD
notification_recipients = security@example.com,soc@example.com

[reporting]
# Report generation
enable = true
output_dir = report/threat_detection
formats = html,json
retention_days = 30
auto_generate = true
generate_interval = 86400

[storage]
# Database configuration
db_type = sqlite
db_path = data/threat_detection.db
retention_days = 90
auto_cleanup = true

[blacklists]
# Blacklist configuration
enable = true
auto_reload = true
reload_interval = 300

blacklist_ips = conf/threat_detection/blacklists/ips.txt
blacklist_domains = conf/threat_detection/blacklists/domains.txt
blacklist_processes = conf/threat_detection/blacklists/processes.txt
blacklist_files = conf/threat_detection/blacklists/files.txt

[whitelists]
# Whitelist configuration
enable = true

whitelist_ips = conf/threat_detection/whitelists/ips.txt
whitelist_processes = conf/threat_detection/whitelists/processes.txt
whitelist_users = conf/threat_detection/whitelists/users.txt

[logging]
# System logging
level = INFO
file = /var/log/threat_detection/system.log
max_size_mb = 100
backup_count = 5
format = json

[performance]
# Performance tuning
max_memory_mb = 512
max_cpu_percent = 20
event_cache_size = 5000
rule_cache_enable = true
